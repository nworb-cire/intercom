x-adapter: &adapter
  build:
    context: .
    dockerfile: core/adapter_runtime/Dockerfile
    target: synthetic
  command: ["python3", "/app/integrations/synthetic/adapter.py"]
  restart: unless-stopped
  networks:
    - media
    - web
  depends_on:
    freeswitch:
      condition: service_healthy
  environment: &adapter-environment
    FREESWITCH_URI: sip:9000@freeswitch:5070

services:
  freeswitch:
    build:
      context: .
      dockerfile: core/freeswitch/Dockerfile
    container_name: intercom-freeswitch
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
    networks:
      media:
        ipv4_address: 172.30.0.2
    environment:
      INTERCOM_ESL_PASSWORD: ${INTERCOM_ESL_PASSWORD:?INTERCOM_ESL_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/fs_cli -p \"$${INTERCOM_ESL_PASSWORD}\" -x status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  controller:
    build:
      context: .
      dockerfile: core/controller/Dockerfile
    container_name: intercom-controller
    restart: unless-stopped
    networks:
      - media
      - web
    depends_on:
      freeswitch:
        condition: service_healthy
    environment:
      FREESWITCH_ESL_HOST: freeswitch
      INTERCOM_ESL_PASSWORD: ${INTERCOM_ESL_PASSWORD:?INTERCOM_ESL_PASSWORD is required}
    ports:
      - 127.0.0.1:8099:8099

  lab-a:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-a
      SOURCE_KIND: sine
      SINE_FREQUENCY: "440"

  lab-b:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-b
      SOURCE_KIND: sine
      SINE_FREQUENCY: "660"

  lab-speaker:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-speaker
      SOURCE_KIND: silence
      CAPTURE_RECEIVED: "true"
    volumes:
      - sink_captures:/captures

  room-a-camera:
    <<: *adapter
    build:
      context: .
      dockerfile: core/adapter_runtime/Dockerfile
      target: rtsp_camera
    environment:
      <<: *adapter-environment
      DEVICE_ID: room-a-camera
      SOURCE_URI: ${ROOM_A_SOURCE_URI:-rtsp://frigate:8554/room_a_sub}
    command: ["python3", "/app/integrations/rtsp-camera/adapter.py"]

  room-b-camera:
    <<: *adapter
    build:
      context: .
      dockerfile: core/adapter_runtime/Dockerfile
      target: rtsp_camera
    environment:
      <<: *adapter-environment
      DEVICE_ID: room-b-camera
      SOURCE_URI: ${ROOM_B_SOURCE_URI:-rtsp://frigate:8554/room_b_sub}
    command: ["python3", "/app/integrations/rtsp-camera/adapter.py"]

  voice-pe:
    build:
      context: .
      dockerfile: core/adapter_runtime/Dockerfile
      target: voice_pe
    command: ["python3", "/app/integrations/voice-pe/adapter.py"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      freeswitch:
        condition: service_healthy
    environment:
      FREESWITCH_URI: sip:9000@172.30.0.2:5070
      DEVICE_ID: voice-pe
      VOICE_PE_MICROPHONE: ${VOICE_PE_MICROPHONE:-false}
      UDP_REMOTE_HOST: ${UDP_REMOTE_HOST:-}
      UDP_REMOTE_PORT: ${UDP_REMOTE_PORT:-18555}
      UDP_TOKEN: ${UDP_TOKEN:-}
      HTTP_PORT: "8088"

volumes:
  sink_captures:

networks:
  media:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  web:
    external: true
