x-adapter: &adapter
  build:
    context: ../intercom/adapter
  restart: unless-stopped
  networks:
    - media
    - web
  depends_on:
    freeswitch:
      condition: service_healthy
  environment: &adapter-environment
    FREESWITCH_URI: sip:9000@freeswitch:5070

services:
  freeswitch:
    build:
      context: ../intercom/freeswitch
    container_name: intercom-freeswitch
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
    networks:
      media:
        ipv4_address: 172.30.0.2
    environment:
      INTERCOM_ESL_PASSWORD: ${INTERCOM_ESL_PASSWORD:?INTERCOM_ESL_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/fs_cli -p \"$${INTERCOM_ESL_PASSWORD}\" -x status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  controller:
    build:
      context: ../intercom/controller
    container_name: intercom-controller
    restart: unless-stopped
    networks:
      - media
      - web
    depends_on:
      freeswitch:
        condition: service_healthy
    environment:
      FREESWITCH_ESL_HOST: freeswitch
      INTERCOM_ESL_PASSWORD: ${INTERCOM_ESL_PASSWORD:?INTERCOM_ESL_PASSWORD is required}
    ports:
      - 127.0.0.1:8099:8099

  lab-a:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-a
      SOURCE_KIND: sine
      SINE_FREQUENCY: "440"

  lab-b:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-b
      SOURCE_KIND: sine
      SINE_FREQUENCY: "660"

  lab-speaker:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-speaker
      SOURCE_KIND: silence
      CAPTURE_RECEIVED: "true"
    volumes:
      - sink_captures:/captures

  room-a-camera:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: room-a-camera
      SOURCE_KIND: gstreamer
      SOURCE_URI: rtsp://frigate:8554/room_a_sub

  room-b-camera:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: room-b-camera
      SOURCE_KIND: gstreamer
      SOURCE_URI: rtsp://frigate:8554/room_b_sub

  voice-pe:
    build:
      context: ../intercom/adapter
    restart: unless-stopped
    network_mode: host
    depends_on:
      freeswitch:
        condition: service_healthy
    environment:
      FREESWITCH_URI: sip:9000@172.30.0.2:5070
      DEVICE_ID: voice-pe
      SOURCE_KIND: silence
      SENDSPIN_RECEIVED: "true"
      SENDSPIN_CLIENT_URL: ws://192.0.2.20:8928/sendspin
      HTTP_PORT: "8088"

volumes:
  sink_captures:

networks:
  media:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  web:
    external: true
