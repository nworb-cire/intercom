x-adapter: &adapter
  build:
    context: ../intercom/adapter
  restart: unless-stopped
  networks:
    - intercom
    - web
  depends_on:
    freeswitch:
      condition: service_healthy
  environment: &adapter-environment
    FREESWITCH_URI: sip:9000@freeswitch:5070

services:
  freeswitch:
    build:
      context: ../intercom/freeswitch
    container_name: intercom-freeswitch
    restart: unless-stopped
    networks:
      - intercom
    environment:
      INTERCOM_ESL_PASSWORD: ${INTERCOM_ESL_PASSWORD:?INTERCOM_ESL_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/fs_cli -p \"$${INTERCOM_ESL_PASSWORD}\" -x status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  controller:
    build:
      context: ../intercom/controller
    container_name: intercom-controller
    restart: unless-stopped
    networks:
      - intercom
      - web
    depends_on:
      freeswitch:
        condition: service_healthy
    environment:
      FREESWITCH_ESL_HOST: freeswitch
      INTERCOM_ESL_PASSWORD: ${INTERCOM_ESL_PASSWORD:?INTERCOM_ESL_PASSWORD is required}
    ports:
      - 127.0.0.1:8099:8099

  lab-a:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-a
      SOURCE_KIND: sine
      SINE_FREQUENCY: "440"

  lab-b:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-b
      SOURCE_KIND: sine
      SINE_FREQUENCY: "660"

  lab-speaker:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: lab-speaker
      SOURCE_KIND: silence
      CAPTURE_RECEIVED: "true"
    volumes:
      - sink_captures:/captures

  room-a-camera:
    <<: *adapter
    environment:
      <<: *adapter-environment
      DEVICE_ID: room-a-camera
      SOURCE_KIND: gstreamer
      SOURCE_URI: rtsp://frigate:8554/room_a_sub

volumes:
  sink_captures:

networks:
  intercom:
    internal: true
  web:
    external: true
